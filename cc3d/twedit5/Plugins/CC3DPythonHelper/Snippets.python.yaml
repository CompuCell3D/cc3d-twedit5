version: 1
menus:
- name: Python Utilities
  description: General Python helper code for file paths, output folders, imports, and steppable lookup.
  snippets:
  - name: Open File In Simulation Output Directory
    description: Shows how to open File In Simulation Output Directory.
    suggested_indent: -1
    code: |+
      file_obj, file_path = self.open_file_in_simulation_output_folder("<FILE_NAME>", mode='w')
      if file_obj is None:
          raise OSError(f"Could not open file {file_path!r} in simulation output folder.")

  - name: Open File In Parameter Scan Main  Output Directory
    description: Shows how to open File In Parameter Scan Main  Output Directory.
    suggested_indent: -1
    code: |+
      file_obj, file_path = self.open_file_in_parameter_scan_main_output_folder("<FILE_NAME>", mode='w')
      if file_obj is None:
          raise OSError(f"Could not open file {file_path!r} in parameter scan main output folder.")

  - name: Open File In Simulation Output Directory (low-level)
    description: Shows how to open File In Simulation Output Directory (low-level).
    suggested_indent: -1
    code: |+
      from pathlib import Path

      if self.output_dir is not None:
          output_path = Path(self.output_dir).joinpath("<FILE_NAME>")
          # create folder to store data
          output_path.parent.mkdir(parents=True, exist_ok=True)
          try:
              file_handle = open(output_path, 'w')
          except IOError:
              print ("Could not open file for writing.")
              return

  - name: Fetch Steppable By Class Name
    description: Shows how to fetch Steppable By Class Name.
    suggested_indent: -1
    code: |+
      self.getSteppableByClassName('STEPPABLE_CLASS_NAME')

  - name: Get Dir Of Current File
    description: Shows how to get Dir Of Current File.
    suggested_indent: -1
    code: |+
      fileDir = os.path.dirname(os.path.abspath(__file__))

  - name: Get FullPath Of Current File
    description: Shows how to get FullPath Of Current File.
    suggested_indent: -1
    code: |+
      filePath = os.path.abspath(__file__)

  - name: Import os
    description: Shows how to import os.
    suggested_indent: -1
    code: |+
      import os

  - name: Set Simulation Output Directory (main Python script)
    description: Shows how to set Simulation Output Directory (main Python script).
    suggested_indent: -1
    code: |+
      # It is best to call this function from __init__ of first registered steppable
      self.set_output_dir(output_dir="<CUSTOM_OUTPUT_DIR>", abs_path=False)

- name: Reaction Diffusion Solver FVM
  description: Code for accessing and modifying the reaction-diffusion finite-volume solver state.
  snippets:
  - name: Get solver
    description: Shows how to get solver.
    suggested_indent: -1
    code: |+
      # Reference to the reaction diffusion finite volume solver, or None if the solver is not loaded
      rd_fvm = self.reaction_diffusion_solver_fvm

  - name: Get a diffusivity field
    description: Shows how to get a diffusivity field.
    suggested_indent: -1
    code: |+
      # Fetch the diffusivity field for a field named "MyField"
      # Requires diffusivity field in medium or everywhere
      my_field_diff = self.field.MyFieldDiff

  - name: Set diffusive transport on a volume surface
    description: Shows how to set diffusive transport on a volume surface.
    suggested_indent: -1
    code: |+
      field_name = 'MyField'              # Name of the field
      surface_name = 'MaxX'               # or MinY, MaxZ, etc.
      loc = CompuCell.Point3D(1, 2, 3)    # Coordinates of volume
      self.reaction_diffusion_solver_fvm.useDiffusiveSurface(field_name, surface_name, loc)  # On a surface
      self.reaction_diffusion_solver_fvm.useDiffusiveSurfaces(field_name, loc)               # On all surfaces

  - name: Set permeable membrane transport on a volume surface
    description: Shows how to set permeable membrane transport on a volume surface.
    suggested_indent: -1
    code: |+
      field_name = 'MyField'              # Name of the field
      surface_name = 'MaxX'               # or MinY, MaxZ, etc.
      loc = CompuCell.Point3D(1, 2, 3)    # Coordinates of volume
      self.reaction_diffusion_solver_fvm.usePermeableSurface(field_name, surface_name, loc)  # On a surface
      self.reaction_diffusion_solver_fvm.usePermeableSurfaces(field_name, loc)               # On all surfaces

  - name: Set a fixed flux on a volume surface
    description: Shows how to set a fixed flux on a volume surface.
    suggested_indent: -1
    code: |+
      field_name = 'MyField'              # Name of the field
      surface_name = 'MaxX'               # or MinY, MaxZ, etc.
      flux_val = 0.1                      # Outward flux value
      loc = CompuCell.Point3D(1, 2, 3)    # Coordinates of volume
      self.reaction_diffusion_solver_fvm.useFixedFluxSurface(field_name, surface_name, flux_val, loc)

  - name: Set a fixed concentration on a volume surface
    description: Shows how to set a fixed concentration on a volume surface.
    suggested_indent: -1
    code: |+
      field_name = 'MyField'              # Name of the field
      surface_name = 'MaxX'               # or MinY, MaxZ, etc.
      conc_val = 0.1                      # Surface concentration value
      loc = CompuCell.Point3D(1, 2, 3)    # Coordinates of volume
      self.reaction_diffusion_solver_fvm.useFixedConcentration(field_name, surface_name, conc_val, loc)

  - name: Set a fixed concentration in a volume
    description: Shows how to set a fixed concentration in a volume.
    suggested_indent: -1
    code: |+
      field_name = 'MyField'  # Name of the field
      conc_val = 1.0  # Volume concentration value
      loc = CompuCell.Point3D(1, 2, 3)  # Coordinates of volume
      self.reaction_diffusion_solver_fvm.useFixedFVConcentration(field_name, conc_val, loc)

  - name: Get/set cell diffusivity
    description: Shows how to get/set cell diffusivity.
    suggested_indent: -1
    code: |+
      # Requires diffusivity by type
      field_name = 'MyField'  # Name of the field
      cell_diff = self.reaction_diffusion_solver_fvm.getCellDiffusivityCoefficient(cell, field_name)
      self.reaction_diffusion_solver_fvm.setCellDiffusivityCoefficient(cell, field_name, 2 * cell_diff)

  - name: Get/set cell permeation coefficients
    description: Shows how to get/set cell permeation coefficients.
    suggested_indent: -1
    code: |+
      rd_fvm = self.reaction_diffusion_solver_fvm
      field_name = 'MyField'  # Name of the field
      # Get/set for a pair of cell and cell type
      perm_cf, cell_bias = rd_fvm.getPermeableCoefficients(cell, ncell.type, field_name)
      rd_fvm.setCellPermeationCoefficient(cell, ncell.type, field_name, 2 * perm_cf)
      rd_fvm.setCellPermeableBiasCoefficient(cell, ncell.type, field_name, 3 * cell_bias)
      # Get/set for a pair of cell and cell
      perm_cf, cell_bias, ncell_bias = rd_fvm.getPermeableCoefficients(cell, ncell, field_name)
      rd_fvm.setCellPermeationCoefficient(cell, ncell.type, field_name, 2 * perm_cf)
      rd_fvm.setCellPermeableBiasCoefficient(cell, ncell.type, field_name, 3 * cell_bias)
      rd_fvm.setCellPermeableBiasCoefficient(ncell, cell.type, field_name, 4 * ncell_bias)


- name: SBML Solver
  description: Code for loading, attaching, stepping, and querying SBML, Antimony, or CellML models.
  snippets:
  - name: 1. Model Initial Data
    description: Shows how to model Initial Data.
    suggested_indent: -1
    code: |+
      # this can be e.g. partial path 'Simulation/osci.sbml'
      model_file = 'PATH_TO_SBML_MODEL'

      initial_conditions = {}
      initial_conditions['SPECIES_NAME1'] = species_val1
      initial_conditions['SPECIES_NAME2'] = species_val2

      step_size = 0.5

  - name: 2. Add SBML model to cell ids
    description: Shows how to add SBML model to cell ids.
    suggested_indent: -1
    code: |+
      # Input SBML model in file 'model_file' or string 'model_string'
      # If using model_string, enclose entire model in a set of triple quotations
      # An integrator can be selected from CVODE: (default, pass nothing), Gillespie: (integrator='gillespie'),
      #   Euler: (integrator='euler'), Runge-Kutta: (integrator='rk4'), and Gillespie Direct Method: (integrator='rk45')
      self.add_sbml_to_cell_ids(model_file=model_file, model_string=model_string, model_name='MODEL_NAME', cell_ids=[1, 3, 7], step_size=step_size,
                                initial_conditions=initial_conditions, integrator=integrator)

  - name: 2. Add Antimony model to cell ids
    description: Shows how to add Antimony model to cell ids.
    suggested_indent: -1
    code: |+
      # Input Antimony model in file 'model_file' or string 'model_string'
      # If using model_string, enclose entire model in a set of triple quotations
      # Initial conditions can be declared in model or with initial_conditions; the latter takes precedence
      # An integrator can be selected from CVODE: (default, pass nothing), Gillespie: (integrator='gillespie'),
      #   Euler: (integrator='euler'), Runge-Kutta: (integrator='rk4'), and Gillespie Direct Method: (integrator='rk45')
      # Model is translated to SBML and stored in memory; use SBML functions in subsequent operations
      self.add_antimony_to_cell_ids(model_file=model_file, model_string=model_string, model_name='MODEL_NAME', cell_ids=[1, 3, 7], step_size=step_size,
                                initial_conditions=initial_conditions, integrator=integrator)

