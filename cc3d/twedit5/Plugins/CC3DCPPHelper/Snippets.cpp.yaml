version: 1
menus:
- name: Setup
  description: Common C++ setup code for obtaining simulator, Potts, XML, and registration pointers.
  snippets:
  - name: Potts / Cell Field / Dim
    description: Shows how to cache the Potts object, cell field, and lattice dimensions in C++.
    suggested_indent: -1
    code: |+
      Potts3D *potts = simulator->getPotts();
      WatchableField3D<CellG *> *cellFieldG = (WatchableField3D<CellG *> *)potts->getCellFieldG();
      if (!cellFieldG) {
          throw CC3DException("Cell field cannot be null");
      }
      Dim3D fieldDim = cellFieldG->getDim();

  - name: Common Cached Pointers
    description: Shows how to cache the most commonly reused simulator pointers in a C++ plugin or steppable.
    suggested_indent: -1
    code: |+
      potts = simulator->getPotts();
      cellFieldG = (WatchableField3D<CellG *> *)potts->getCellFieldG();
      cellInventoryPtr = &potts->getCellInventory();
      boundaryStrategy = BoundaryStrategy::getInstance();
      automaton = potts->getAutomaton();
      xmlData = _xmlData;

  - name: Neighbor Order Setup
    description: Shows how to compute and cache the maximum direct-neighbor index from a neighbor order.
    suggested_indent: -1
    code: |+
      boundaryStrategy = BoundaryStrategy::getInstance();
      unsigned int maxNeighborIndex = boundaryStrategy->getMaxNeighborIndexFromNeighborOrder(NEIGHBOR_ORDER);

  - name: Store XML And Register Steerable
    description: Shows how to keep the XML element pointer and register the object for steering updates.
    suggested_indent: -1
    code: |+
      xmlData = _xmlData;
      simulator->registerSteerableObject(this);

  - name: Preload Plugin
    description: Shows how to preload another plugin and initialize it only if it is not already registered.
    suggested_indent: -1
    code: |+
      // This code is usually called from init
      bool pluginAlreadyRegisteredFlag;
      Plugin *plugin = Simulator::pluginManager.get("PLUGIN_NAME", &pluginAlreadyRegisteredFlag);
      if (!pluginAlreadyRegisteredFlag)
          plugin->init(simulator);

  - name: Register Energy Function
    description: Shows how to register a custom energy function with the Potts object.
    suggested_indent: -1
    code: |+
      potts->registerEnergyFunctionWithName(this, toString());

  - name: Register Cell Change Watcher
    description: Shows how to register a cell change watcher with the Potts object.
    suggested_indent: -1
    code: |+
      potts->registerCellGChangeWatcher(this);

  - name: Register Fixed Steppers
    description: Shows how to register a fixed stepper with the Potts object.
    suggested_indent: -1
    code: |+
      potts->registerStepper(this);

- name: Visit
  description: Iteration patterns for walking cells, neighbors, clusters, or lattice regions in C++.
  snippets:
  - name: All Cells
    description: Shows an iteration pattern for all Cells.
    suggested_indent: -1
    code: |+
      CellInventory::cellInventoryIterator cInvItr;
      CellG *cell = 0;

      for (cInvItr = cellInventoryPtr->cellInventoryBegin(); cInvItr != cellInventoryPtr->cellInventoryEnd(); ++cInvItr) {
          cell = cellInventoryPtr->getCell(cInvItr);
          // Put your code here
          cerr << "cell id=" << cell->id << endl;
      }

  - name: Pixel Neighbors
    description: Shows an iteration pattern for pixel Neighbors.
    suggested_indent: -1
    code: |+
      Neighbor neighbor;
      CellG *nCell = 0;
      Point3D pt;

      for (unsigned int nIdx = 0; nIdx <= maxNeighborIndex; ++nIdx) {
          neighbor = boundaryStrategy->getNeighborDirect(const_cast<Point3D &>(pt), nIdx);
          if (!neighbor.distance) {
              // if distance is 0 then the neighbor returned is invalid
              continue;
          }
          nCell = cellFieldG->get(neighbor.pt);

          if (nCell) {
              cerr << "neighbor pixel cell id=" << nCell->id << endl;
          }
      }

  - name: Cell Pixels Matching Cell
    description: Shows an iteration pattern for cell Pixels Matching Cell.
    suggested_indent: -1
    code: |+
      Neighbor neighbor;
      CellG *nCell = 0;
      Point3D pt;

      for (unsigned int nIdx = 0; nIdx <= maxNeighborIndex; ++nIdx) {
          neighbor = boundaryStrategy->getNeighborDirect(const_cast<Point3D &>(pt), nIdx);
          if (!neighbor.distance) {
              continue;
          }
          nCell = cellFieldG->get(neighbor.pt);
          if (nCell != cell) {
              continue;
          }

          // Put your code here
      }

  - name: Compartments Of A Cluster
    description: Shows an iteration pattern for compartments Of A Cluster.
    suggested_indent: -1
    code: |+
      CC3DCellList compartments = potts->getCellInventory().getClusterInventory().getClusterCells(CELL->clusterId);
      for (int i = 0; i < compartments.size(); ++i) {
          cerr << "compartment id=" << compartments[i]->id << endl;
      }

  - name: Entire Lattice
    description: Shows an iteration pattern for entire Lattice.
    suggested_indent: -1
    code: |+
      Point3D pt;
      for (pt.x = 0; pt.x < fieldDim.x; ++pt.x)
          for (pt.y = 0; pt.y < fieldDim.y; ++pt.y)
              for (pt.z = 0; pt.z < fieldDim.z; ++pt.z) {
                  CellG *cell = cellFieldG->get(pt);
                  // Put your code here
              }

- name: Cell Operations
  description: Common C++ code for reading, creating, or modifying cells and cell types.
  snippets:
  - name: Get Cell At Pixel
    description: Shows how to get Cell At Pixel.
    suggested_indent: -1
    code: |+
      Point3D pt(X, Y, Z);
      CellG *cell = cellFieldG->get(pt);

  - name: Get Type Id From Name
    description: Shows how to get Type Id From Name.
    suggested_indent: -1
    code: |+
      Automaton *automaton = potts->getAutomaton();
      unsigned char typeId = automaton->getTypeId("CELL_TYPE_NAME");

  - name: Set Cell Type
    description: Shows how to set Cell Type.
    suggested_indent: -1
    code: |+
      Automaton *automaton = potts->getAutomaton();
      cell->type = automaton->getTypeId("CELL_TYPE_NAME");

  - name: Create Cell At Pixel
    description: Shows how to create Cell At Pixel.
    suggested_indent: -1
    code: |+
      Point3D pt(X, Y, Z);
      CellG *cell = potts->createCellG(pt);

  - name: Create Cell With Explicit Spin
    description: Shows how to create Cell With Explicit Spin.
    suggested_indent: -1
    code: |+
      Point3D pt(X, Y, Z);
      CellG *cell = potts->createCellGSpecifiedIds(pt, SPIN);

  - name: Create Cell With Spin And Cluster
    description: Shows how to create Cell With Spin And Cluster.
    suggested_indent: -1
    code: |+
      Point3D pt(X, Y, Z);
      CellG *cell = potts->createCellGSpecifiedIds(pt, SPIN, CLUSTER_ID);

  - name: Assign Type After Creation
    description: Shows how to assign Type After Creation.
    suggested_indent: -1
    code: |+
      Point3D pt(X, Y, Z);
      CellG *cell = potts->createCellG(pt);
      cell->type = potts->getAutomaton()->getTypeId("CELL_TYPE_NAME");

  - name: Fill Box With Cell
    description: Shows how to fill Box With Cell.
    suggested_indent: -1
    code: |+
      Point3D seedPt(X0, Y0, Z0);
      Point3D fillPt;
      CellG *cell = potts->createCellG(seedPt);

      for (fillPt.z = Z0; fillPt.z <= Z1; ++fillPt.z)
          for (fillPt.y = Y0; fillPt.y <= Y1; ++fillPt.y)
              for (fillPt.x = X0; fillPt.x <= X1; ++fillPt.x) {
                  cellFieldG->set(fillPt, cell);
              }

  - name: Create Cell And Run Steppers
    description: Shows how to create Cell And Run Steppers.
    suggested_indent: -1
    code: |+
      Point3D pt(X, Y, Z);
      CellG *cell = potts->createCellG(pt);
      potts->runSteppers(); // useful when manual field updates should trigger VolumeTracker and related bookkeeping

  - name: Set Pixel And Run Steppers
    description: Shows how to set Pixel And Run Steppers.
    suggested_indent: -1
    code: |+
      Point3D pt(X, Y, Z);
      cellFieldG->set(pt, cell);
      potts->runSteppers(); // useful after direct field writes outside copy attempts

- name: Cell Attributes
  description: Common C++ code for reading or writing custom cell attributes and extra data.
  snippets:
  - name: Get Extra Attribute
    description: Shows how to get Extra Attribute.
    suggested_indent: -1
    code: |+
      ACCESSOR_NAME.get(CELL->extraAttribPtr)->ATTRIBUTE_COMPONENT

  - name: Set Extra Attribute
    description: Shows how to set Extra Attribute.
    suggested_indent: -1
    code: |+
      ACCESSOR_NAME.get(CELL->extraAttribPtr)->ATTRIBUTE_COMPONENT = VALUE;

  - name: Register Extra Attribute Class
    description: Shows how to register Extra Attribute Class.
    suggested_indent: -1
    code: |+
      potts->getCellFactoryGroupPtr()->registerClass(&ACCESSOR_NAME);

